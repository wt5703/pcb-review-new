spring:
  application:
    name: pcb-review
  datasource:
    url: jdbc:h2:mem:pcb_review;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    context-path: /leapmotor/pcb_review
logging:
  level:
    com.bms: INFO
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
resource-service:
  api-prefix: ${RESOURCE_SERVICE_API_PREFIX:http://10.195.135.149:30860/leapmotor/pm/resource}
  dir-path: ${RESOURCE_SERVICE_DIR_PATH:/user/bms_platform/pcb_review/test1}
