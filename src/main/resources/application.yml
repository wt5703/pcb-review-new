spring:
  application:
    name: pcb-review
  datasource:
    url: jdbc:h2:mem:pcb_review;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  servlet:
    context-path: /api/v1
logging:
  level:
    com.leapmotor.pcbreview: INFO
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
