spring:
  application:
    name: pcb-review
  datasource:
    url: jdbc:h2:mem:pcb_review;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 工艺图、结构图通常为压缩包，覆盖 Spring Boot 默认 1MB 限制。
      max-file-size: 200MB
      max-request-size: 210MB
server:
  servlet:
    context-path: /leapmotor/pcb_review
logging:
  level:
    com.bms: INFO
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
resource-service:
  api-prefix: ${RESOURCE_SERVICE_API_PREFIX:http://10.195.135.149:30860/leapmotor/pm/resource}
  dir-path: ${RESOURCE_SERVICE_DIR_PATH:/user/bms_platform/pcb_review/test1}
  mock-enabled: ${RESOURCE_SERVICE_MOCK_ENABLED:true}
user-center:
  # 用户中心当前用户接口尚未联通时留空，系统使用王鹏飞全权限 Mock 用户。
  current-user-url: ${USER_CENTER_CURRENT_USER_URL:}
