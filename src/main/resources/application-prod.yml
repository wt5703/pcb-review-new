  current-user-url: ${USER_CENTER_CURRENT_USER_URL:http://10.195.135.149:30167/leapenergy/portal}
  # 白名单等指定人员查询才使用员工工号路径模板。
  user-profile-url-template: ${USER_CENTER_USER_PROFILE_URL_TEMPLATE:http://10.195.135.149:30167/leapenergy/portal/user/{employeeNo}}
